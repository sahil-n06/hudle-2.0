openapi: 3.0.3
info:
  title: PlaySpot API
  version: 1.1.0
  description: Venue discovery, availability and bookings. Admin sessions use an httpOnly cookie.
servers: [{ url: /api }]
paths:
  /health: { get: { tags: [Operations], responses: { '200': { description: Process running } } } }
  /ready:
    {
      get:
        {
          tags: [Operations],
          responses:
            {
              '200': { description: Database reachable },
              '500': { $ref: '#/components/responses/Error' },
            },
        },
    }
  /venues:
    get:
      tags: [Venues]
      parameters:
        [
          { name: sport, in: query, schema: { type: string } },
          { name: city, in: query, schema: { type: string } },
          { name: q, in: query, schema: { type: string } },
        ]
      responses: { '200': { description: Active venues } }
  /venues/filters:
    { get: { tags: [Venues], responses: { '200': { description: Sports and cities } } } }
  /venues/{id}:
    get:
      {
        tags: [Venues],
        parameters: [{ $ref: '#/components/parameters/id' }],
        responses:
          { '200': { description: Venue }, '404': { $ref: '#/components/responses/Error' } },
      }
  /venues/{id}/slots:
    get:
      tags: [Venues]
      parameters:
        [
          { $ref: '#/components/parameters/id' },
          { name: date, in: query, required: true, schema: { type: string, format: date } },
        ]
      responses: { '200': { description: Availability for the date } }
  /bookings:
    post:
      tags: [Bookings]
      requestBody:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/BookingInput' } } },
        }
      responses:
        {
          '201': { description: Booking created, includes reference },
          '409': { description: Slot already booked },
          '429': { $ref: '#/components/responses/Error' },
        }
    get:
      tags: [Bookings]
      summary: Bookings for the verified email (needs the customer cookie)
      security: [{ customerAuth: [] }]
      responses:
        {
          '200': { description: 'Customer bookings; meta.email is the verified email' },
          '401': { $ref: '#/components/responses/Error' },
        }
  /bookings/access:
    post:
      tags: [Bookings]
      summary: Email a 6-digit sign-in code
      description: >-
        Without SMTP_URL the code is printed to the API console, and outside
        production it is also returned as data.devCode.
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [email],
                      properties: { email: { type: string, format: email } },
                    },
                },
            },
        }
      responses:
        {
          '202': { description: Code sent },
          '429': { $ref: '#/components/responses/Error' },
          '503': { $ref: '#/components/responses/Error' },
        }
  /bookings/access/verify:
    post:
      tags: [Bookings]
      summary: Exchange the code for a 24-hour customer session cookie
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [email, code],
                      properties:
                        {
                          email: { type: string, format: email },
                          code: { type: string, example: '123456' },
                        },
                    },
                },
            },
        }
      responses:
        {
          '200': { description: Signed in; sets the playspot_customer cookie },
          '400': { $ref: '#/components/responses/Error' },
        }
  /bookings/access/logout:
    post:
      tags: [Bookings]
      responses: { '204': { description: Customer cookie cleared } }
  /bookings/confirmation/{reference}:
    get:
      tags: [Bookings]
      parameters: [{ $ref: '#/components/parameters/reference' }]
      responses:
        {
          '200': { description: Booking for this reference },
          '404': { $ref: '#/components/responses/Error' },
        }
  /bookings/confirmation/{reference}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel with the booking reference (no sign-in needed)
      parameters: [{ $ref: '#/components/parameters/reference' }]
      responses:
        {
          '200': { description: Booking cancelled },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
        }
  /bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel one of the verified customer's bookings
      security: [{ customerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        {
          '200': { description: Booking cancelled },
          '401': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
        }
  /admin/login:
    post:
      tags: [Admin]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [email, password],
                      properties:
                        { email: { type: string, format: email }, password: { type: string } },
                    },
                },
            },
        }
      responses:
        {
          '200': { description: Sets the httpOnly playspot_admin cookie },
          '401': { $ref: '#/components/responses/Error' },
          '429': { $ref: '#/components/responses/Error' },
        }
  /admin/logout:
    { post: { tags: [Admin], responses: { '204': { description: Session cookie cleared } } } }
  /admin/me:
    {
      get:
        {
          tags: [Admin],
          security: [{ cookieAuth: [] }],
          responses:
            {
              '200': { description: Current admin },
              '401': { $ref: '#/components/responses/Error' },
            },
        },
    }
  /admin/venues:
    get:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        responses: { '200': { description: All non-deleted venues } },
      }
    post:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        requestBody: { $ref: '#/components/requestBodies/Venue' },
        responses: { '201': { description: Venue created } },
      }
  /admin/venues/{id}:
    get:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: '#/components/parameters/id' }],
        responses: { '200': { description: Venue } },
      }
    put:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: '#/components/parameters/id' }],
        requestBody: { $ref: '#/components/requestBodies/Venue' },
        responses: { '200': { description: Updated venue } },
      }
    delete:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: '#/components/parameters/id' }],
        responses: { '204': { description: Soft deleted; bookings retained } },
      }
  /admin/venues/{id}/status:
    patch:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: '#/components/parameters/id' }],
        requestBody:
          {
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        required: [isActive],
                        properties: { isActive: { type: boolean } },
                      },
                  },
              },
          },
        responses: { '200': { description: Active or inactive venue } },
      }
  /admin/venues/{id}/templates:
    get:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: '#/components/parameters/id' }],
        responses: { '200': { description: Recurring slots } },
      }
    post:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: '#/components/parameters/id' }],
        responses: { '201': { description: Recurring slot created } },
      }
  /admin/venues/{id}/templates/{slotId}:
    delete:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        parameters:
          [
            { $ref: '#/components/parameters/id' },
            { name: slotId, in: path, required: true, schema: { type: integer } },
          ],
        responses: { '204': { description: Deleted } },
      }
  /admin/venues/{id}/date-slots:
    get:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: '#/components/parameters/id' }],
        responses: { '200': { description: One-off slots } },
      }
    post:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        parameters: [{ $ref: '#/components/parameters/id' }],
        responses: { '201': { description: One-off slot created } },
      }
  /admin/venues/{id}/date-slots/{slotId}:
    delete:
      {
        tags: [Admin],
        security: [{ cookieAuth: [] }],
        parameters:
          [
            { $ref: '#/components/parameters/id' },
            { name: slotId, in: path, required: true, schema: { type: integer } },
          ],
        responses: { '204': { description: Deleted } },
      }
  /admin/bookings:
    get:
      tags: [Admin]
      security: [{ cookieAuth: [] }]
      parameters:
        [
          { name: venueId, in: query, schema: { type: integer } },
          { name: date, in: query, schema: { type: string, format: date } },
          { name: status, in: query, schema: { enum: [confirmed, cancelled] } },
          { name: search, in: query, schema: { type: string } },
          { name: page, in: query, schema: { type: integer, default: 1 } },
          { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } },
        ]
      responses: { '200': { description: Paginated data and meta } }
  /admin/bookings/{id}/cancel:
    {
      post:
        {
          tags: [Admin],
          security: [{ cookieAuth: [] }],
          parameters: [{ $ref: '#/components/parameters/id' }],
          responses: { '200': { description: Booking cancelled } },
        },
    }
components:
  parameters:
    id: { name: id, in: path, required: true, schema: { type: integer } }
    reference:
      { name: reference, in: path, required: true, schema: { type: string, example: PS-12AB34CD } }
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: playspot_admin }
    customerAuth: { type: apiKey, in: cookie, name: playspot_customer }
  schemas:
    VenueInput:
      {
        type: object,
        required: [name, sport, location, pricePerHour],
        properties:
          {
            name: { type: string },
            sport: { type: string },
            location: { type: string },
            description: { type: string },
            pricePerHour: { type: integer },
            imageUrl: { type: string, nullable: true },
            isActive: { type: boolean },
          },
      }
    BookingInput:
      {
        type: object,
        required: [venueId, date, startTime, name, email, phone],
        properties:
          {
            venueId: { type: integer },
            date: { type: string, format: date },
            startTime: { type: string, example: '18:00' },
            name: { type: string },
            email: { type: string, format: email },
            phone: { type: string },
          },
      }
  requestBodies:
    {
      Venue:
        {
          required: true,
          content: { application/json: { schema: { $ref: '#/components/schemas/VenueInput' } } },
        },
    }
  responses:
    {
      Error:
        {
          description: Error,
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      properties:
                        {
                          error:
                            {
                              type: object,
                              properties:
                                {
                                  code: { type: string },
                                  message: { type: string },
                                  details: { type: array, items: { type: object } },
                                  requestId: { type: string },
                                },
                            },
                        },
                    },
                },
            },
        },
    }
