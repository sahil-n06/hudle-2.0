services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: venue
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/venue
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@playspot.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-in-production}
      CORS_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
      COOKIE_SECURE: "false"
      APP_TZ: Asia/Kolkata
      # Needed for "My bookings" email codes in production mode.
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-PlaySpot <no-reply@playspot.local>}
    depends_on:
      db: { condition: service_healthy }
    ports: ["4000:4000"]

  web:
    build:
      context: ./web
      args: { API_URL: http://api:4000 }
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
